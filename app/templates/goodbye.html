<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goodbye — HAQLOON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="instrument-screen">
    <div class="auth-card card" style="animation: fade-out-in 0.5s ease;">
      <div class="radar" style="opacity: 0.55;">
        <div class="radar-sweep" style="animation-duration: 5s;"></div>
        <div class="radar-core"></div>
      </div>

      <div class="eyebrow" style="justify-content:center;">Link Terminated</div>
      <div class="auth-title">Goodbye, {{ username }}</div>
      <div class="auth-sub">Thank you for using HAQLOON.</div>

      <div class="countdown-row">
        <svg class="countdown-ring" viewBox="0 0 20 20">
          <circle class="track" cx="10" cy="10" r="9" />
          <circle class="progress" cx="10" cy="10" r="9" />
        </svg>
        <span>Returning to sign-in in <span id="count">3</span>s</span>
      </div>

      <a class="btn btn-ghost btn-block" href="/login">Return to Sign In</a>
    </div>
  </div>

  <style>
    @keyframes fade-out-in { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
  </style>
  <script>
    let seconds = 3;
    const counter = document.getElementById("count");
    const timer = setInterval(() => {
      seconds -= 1;
      if (counter) counter.textContent = Math.max(seconds, 0);
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "/login";
      }
    }, 1000);
  </script>
</body>
</html>
