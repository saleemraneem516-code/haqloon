{% extends "base.html" %}

{% block title %}
LiDAR Map
{% endblock %}

{% block page_heading %}
LiDAR Map
{% endblock %}

{% block page_sub %}
360° RPLIDAR A1 Mapping
{% endblock %}

{% block content %}

<div class="stat-card">

    <h2>Live LiDAR Map</h2>

    <canvas
        id="lidarCanvas"
        width="600"
        height="600"
        style="border:2px solid red;">
    </canvas>

</div>

<script>

async function loadLidar() {

    try {

        const response = await fetch("/api/lidar");

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        console.log("LIDAR DATA:", data);

        drawLidar(data.points || []);

    } catch (error) {

        console.error("LiDAR error:", error);

    }
}


function drawLidar(points) {

    const canvas =
        document.getElementById("lidarCanvas");

    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    /*
     * LiDAR coordinates are in meters.
     * 1 meter = 100 pixels.
     */
    const scale = 100;


    /*
     * Grid
     */

    ctx.strokeStyle = "#334155";
    ctx.lineWidth = 1;

    for (let r = 50; r <= 250; r += 50) {

        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            r,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }


    /*
     * Center / Rover
     */

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        5,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
     * LiDAR points
     */

    ctx.fillStyle = "#00ff88";

    points.forEach(function (p) {

        let x;
        let y;


        /*
         * Format:
         * {x: ..., y: ...}
         */

        if (
            p !== null &&
            typeof p === "object" &&
            !Array.isArray(p)
        ) {

            x = Number(p.x);
            y = Number(p.y);

        }


        /*
         * Also support:
         * [x, y]
         */

        else if (Array.isArray(p)) {

            x = Number(p[0]);
            y = Number(p[1]);

        }


        if (
            !Number.isFinite(x) ||
            !Number.isFinite(y)
        ) {

            return;

        }


        const canvasX =
            cx + (x * scale);

        const canvasY =
            cy - (y * scale);


        if (
            canvasX < 0 ||
            canvasX > canvas.width ||
            canvasY < 0 ||
            canvasY > canvas.height
        ) {

            return;

        }


        ctx.beginPath();

        ctx.arc(
            canvasX,
            canvasY,
            2,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

}


/*
 * Load immediately
 */

loadLidar();


/*
 * Update every 3 seconds
 */

setInterval(
    loadLidar,
    3000
);

</script>

{% endblock %}
